<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Apps</title>
  <meta name="description" content="A pocket collection of web apps." />
  <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apps" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b10;
      --fg: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.48);
      --tile-ring: rgba(255, 255, 255, 0.08);
      --tile-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
      --glow: radial-gradient(1200px 600px at 50% -10%, rgba(120, 110, 255, 0.10), transparent 60%);
      --tile-l: 32%;
      --tile-c: 0.09;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f1ea;
        --fg: #15141a;
        --muted: rgba(21, 20, 26, 0.5);
        --tile-ring: rgba(0, 0, 0, 0.06);
        --tile-shadow: 0 10px 24px -14px rgba(40, 30, 10, 0.45);
        --glow: radial-gradient(1200px 600px at 50% -10%, rgba(255, 190, 120, 0.22), transparent 60%);
        --tile-l: 62%;
        --tile-c: 0.12;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      background-image: var(--glow);
      background-attachment: fixed;
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      min-height: 100dvh;
      padding:
        calc(env(safe-area-inset-top) + 56px)
        calc(env(safe-area-inset-right) + 22px)
        calc(env(safe-area-inset-bottom) + 40px)
        calc(env(safe-area-inset-left) + 22px);
    }

    main { max-width: 760px; margin: 0 auto; }

    header { margin-bottom: 36px; }
    .sec + .sec { margin-top: 40px; }
    .sec h2 {
      font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 18px 2px;
    }
    .date {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(44px, 12vw, 72px);
      line-height: 1;
      letter-spacing: -0.01em;
      margin-top: 10px;
    }
    h1 em { font-style: italic; color: var(--muted); }

    .grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 18px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 34px 26px; }
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      animation: rise 0.5s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 45ms + 80ms);
      outline: none;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .tile {
      width: 100%;
      max-width: 76px;
      aspect-ratio: 1;
      border-radius: 23%;
      overflow: hidden;
      display: grid;
      place-items: center;
      box-shadow: var(--tile-shadow), inset 0 0 0 1px var(--tile-ring);
      transition: transform 0.18s cubic-bezier(.2, .8, .2, 1), box-shadow 0.18s;
      position: relative;
    }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile.glyph {
      background:
        radial-gradient(120% 90% at 30% 15%, oklch(calc(var(--tile-l) + 18%) var(--tile-c) var(--h)), transparent 70%),
        oklch(var(--tile-l) var(--tile-c) var(--h));
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 38px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .tile::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 45%);
      pointer-events: none;
    }
    .app:active .tile { transform: scale(0.9); }
    @media (hover: hover) {
      .app:hover .tile { transform: translateY(-3px); }
    }
    .app:focus-visible .tile { box-shadow: var(--tile-shadow), 0 0 0 3px var(--fg); }

    .name {
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      grid-column: 1 / -1;
      color: var(--muted);
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 22px;
    }

    @media (prefers-reduced-motion: reduce) {
      .app { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="date" id="date"></p>
      <h1>Apps<em>.</em></h1>
    </header>
    <div id="sections"></div>
  </main>

  <script src="apps.js"></script>
  <script>
    (function () {
      var d = new Date();
      document.getElementById("date").textContent =
        d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

      function hueFor(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
        return h;
      }

      var root = document.getElementById("sections");
      var apps = window.APPS || [];

      if (!apps.length) {
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Nothing here yet.";
        root.appendChild(p);
        return;
      }

      // Group tiles by section, in the order sections first appear. Apps without one go under "Other".
      var grids = {};
      function gridFor(name) {
        if (grids[name]) return grids[name];
        var sec = document.createElement("section");
        sec.className = "sec";
        var h = document.createElement("h2");
        h.textContent = name;
        var ul = document.createElement("ul");
        ul.className = "grid";
        sec.appendChild(h);
        sec.appendChild(ul);
        root.appendChild(sec);
        return (grids[name] = ul);
      }

      apps.forEach(function (app, i) {
        var grid = gridFor(app.section || "Other");
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "app";
        a.href = app.href || app.slug + "/" + (location.protocol === "file:" ? "index.html" : "");
        a.style.setProperty("--i", i);
        if (app.blurb) a.title = app.blurb;
        a.setAttribute("aria-label", app.name + (app.blurb ? " — " + app.blurb : ""));

        var tile = document.createElement("span");
        tile.className = "tile";
        if (app.icon) {
          var img = document.createElement("img");
          img.src = app.icon;
          img.alt = "";
          img.decoding = "async";
          tile.appendChild(img);
        } else {
          tile.classList.add("glyph");
          tile.style.setProperty("--h", app.hue != null ? app.hue : hueFor(app.slug));
          tile.textContent = app.glyph || app.name.charAt(0).toUpperCase();
        }

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = app.name;

        a.appendChild(tile);
        a.appendChild(name);
        li.appendChild(a);
        grid.appendChild(li);
      });
    })();
  </script>
</body>
</html>
